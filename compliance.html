<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compliance | de Vries Marine</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="solutions.html">Solutions</a>
    <a href="products.html">Products</a>
    <a href="gallery.html">Gallery</a>
    <a href="compliance.html">Compliance</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="overlay">
    <h1>Compliance</h1>
    <p>Our site is currently under construction.<br>
       Please check back soon!</p>
    <div class="countdown" id="countdown">Loading countdown...</div>
  </div>

  <footer>
    <a>&copy; <span id="copyright-year"></span> de Vries Marine, Co.  All rights reserved.</a>
  </footer>

  <script>
    const countdownEl = document.getElementById("countdown");
    const launchDate = new Date("March 1, 2026 00:00:00").getTime();

    const updateCountdown = () => {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance <= 0) {
        countdownEl.style.display = 'none';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    };

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const yearEl = document.getElementById('copyright-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
</body>
</html>
